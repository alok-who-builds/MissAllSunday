<script>

function fixPrefs(){const p={...DEF,...S.prefs};['pom','deep'].forEach(k=>{if(!Array.isArray(p[k])||p[k].length!==2||!p[k].every(x=>Number.isInteger(x)&&x>0&&x<=240))p[k]=DEF[k]});if(!(p.vol>=0&&p.vol<=1))p.vol=DEF.vol;if(!MODES[p.mode])p.mode='cont';S.prefs=p;MODES.pom=['Pomodoro '+p.pom[0]+'/'+p.pom[1],...p.pom];MODES.deep=['Deep focus '+p.deep[0]+'/'+p.deep[1],...p.deep]}
const IC={play:'<path d="M7 4l12 8-12 8z"/>',pause:'<path d="M8 5v14M16 5v14"/>',check:'<path d="M4 12l5 5L20 6"/>',down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',tag:'<path d="M4 12l8-8h8v8l-8 8z"/>',key:'<path d="M4 8h16v8H4zM7 12h.01M11 12h2M16 12h.01"/>'};

let AC=null,warned=false;

function play(n,force,vol){const p=S.prefs;if(!force){if(!p.sound)return;if(ALERT.includes(n)?!p.alerts:!p.ui)return}
 const c=actx();if(!c)return;vol=vol===undefined?p.vol:vol;if(vol<=0)return;
 const go=()=>{const m=c.createGain();m.gain.value=vol*.5;m.connect(c.destination);const t0=c.currentTime+.02;
  SND[n].forEach(([f,t,d,g])=>{[[f,1,'sine'],[f*2,.18,'triangle']].forEach(([fr,k,ty])=>{const o=c.createOscillator(),x=c.createGain();o.type=ty;o.frequency.value=fr;const s=t0+t,a=(g||.8)*k;x.gain.setValueAtTime(.0001,s);x.gain.exponentialRampToValueAtTime(a,s+.015);x.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(x).connect(m);o.start(s);o.stop(s+d+.05)})})};
 const bl=()=>{if(!warned){warned=true;toast('Sound is blocked until you click or tap the page. See Settings → Sound.')}};
 if(c.state==='running')go();else c.resume().then(()=>c.state==='running'?go():bl()).catch(bl)}
addEventListener('pointerdown',actx,{once:true});addEventListener('keydown',actx,{once:true});
function nstat(){return 'Notification' in window?Notification.permission:'unsupported'}
function notif(t,b){if(!S.prefs.notif||nstat()!=='granted'||!document.hidden)return;try{new Notification(t,{body:b,tag:'everyday',silent:true})}catch(e){}}
function phaseAlert(n){const a=S.active,L=advance.last;if(!a||!L)return;const key=a.id+':'+a.tc;
 try{if(localStorage.getItem('everyday.alert')===key)return;localStorage.setItem('everyday.alert',key)}catch(e){}
 const br=a.phase==='break';if(br&&!S.prefs.remind)return;
 const msg=br?'Nice focus. Take your '+MODES[a.mode][2]+' minute break.':'Break’s over. Back to '+cat(a.catId).name+'.';
 if(n-L.t<15000){play(br?'toBreak':'toWork');notif(br?'Time for a break':'Back to focus',msg)}toast(msg)}
function nText(){const s=nstat();return{unsupported:'This browser doesn’t support notifications.',granted:'Permission granted. Alerts show only while this tab is in the background, and your system’s Do Not Disturb or Focus mode can still silence them.',denied:'Blocked. Re-enable notifications for this site in your browser’s site settings.',default:'Not asked yet. Press the button, then choose Allow. Embedded or private windows may block this.'}[s]}

function settingsDlg(){const p=S.prefs,sw=(n,l,v)=>'<label class="sw"><span>'+l+'</span><input type="checkbox" name="'+n+'"'+(v?' checked':'')+'></label>',pv=(n,l)=>'<button class="b sm" type="button" onclick="prev(\''+n+'\')">'+ic('play')+l+'</button> ';
 modal('Settings','<h3>Sound</h3>'+sw('sd','Sound on',p.sound)+sw('ui','Interface sounds (start, pause, finish, taps)',p.ui)+sw('al','Timer alerts (Pomodoro phase changes)',p.alerts)+sw('rm','Break reminders (alert when focus ends)',p.remind)+'<label>Volume</label><input type="range" name="v" min="0" max="100" value="'+Math.round(p.vol*100)+'"><div class="row">'+pv('start','Start')+pv('pause','Pause')+pv('resume','Resume')+pv('finish','Finish')+pv('toBreak','Break')+pv('toWork','Focus')+'</div><p class="lab" id="aud">'+audText()+'</p>'
 +'<h3>Notifications</h3>'+sw('nt','Browser notifications',p.notif)+'<button class="b sm" type="button" onclick="askNotif()">'+ic('tag')+'Allow notifications</button><p class="lab" id="nst">'+nText()+'</p>'
 +'<h3>Timer</h3><label>Default mode</label><select name="m">'+Object.entries(MODES).map(([k,v])=>'<option value="'+k+'"'+(k===p.mode?' selected':'')+'>'+esc(v[0])+'</option>').join('')+'</select><div class="g2"><div><label>Pomodoro focus (min)</label><input name="pw" type="number" min="1" max="240" value="'+p.pom[0]+'"></div><div><label>Pomodoro break</label><input name="pb" type="number" min="1" max="240" value="'+p.pom[1]+'"></div><div><label>Deep focus (min)</label><input name="dw" type="number" min="1" max="240" value="'+p.deep[0]+'"></div><div><label>Deep break</label><input name="db" type="number" min="1" max="240" value="'+p.deep[1]+'"></div></div>'
 +'<h3>Workday</h3><label>Workday starts at</label><select name="h">'+[0,1,2,3,4,5,6,7,8].map(h=>'<option value="'+h+'"'+(h===H()?' selected':'')+'>'+pad(h)+':00</option>').join('')+'</select><p class="lab">Changing it re-assigns sessions to workdays; no hours are lost. Timer lengths and workday start can only change while no session is running.</p><h3>Danger zone</h3><button class="b sm dn" type="button" onclick="wipe()">Erase all data</button>','Save',f=>{
  const pw=+f.pw.value,pb=+f.pb.value,dw=+f.dw.value,db=+f.db.value,hr=+f.h.value;if(![pw,pb,dw,db].every(x=>Number.isInteger(x)&&x>=1&&x<=240))return'Timer lengths must be whole minutes from 1 to 240.';
  if(f.nt.checked&&nstat()!=='granted')return'Press “Allow notifications” and accept the browser prompt first.';
  if(S.active&&(hr!==H()||pw!==p.pom[0]||pb!==p.pom[1]||dw!==p.deep[0]||db!==p.deep[1]))return'Finish the running session to change timer lengths or the workday start.';
  Object.assign(S.prefs,{sound:f.sd.checked,vol:+f.v.value/100,ui:f.ui.checked,alerts:f.al.checked,remind:f.rm.checked,notif:f.nt.checked,mode:f.m.value,pom:[pw,pb],deep:[dw,db],startHour:hr});fixPrefs();render.mode=null;save();render();toast('Settings saved.')})}
function help(){modal('Keyboard shortcuts','<p><kbd>Space</kbd> start / pause / resume</p><p><kbd>F</kbd> finish (press twice to confirm)</p><p><kbd>N</kbd> new category · <kbd>S</kbd> settings</p><p><kbd>←</kbd> <kbd>→</kbd> previous / next day · <kbd>T</kbd> today</p><p><kbd>?</kbd> this list · <kbd>Esc</kbd> close dialogs</p>','Got it',()=>{})}
const COLS=['#F45116','#B4C41C','#9A754E','#E8A317','#3F8F7A','#C2487A','#6C7BD1','#7A4B2A'];
let S,mem=false,sel,off=0,fin=false,lastPh=null;
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const blank=()=>({v:1,cats:[],sessions:[],prefs:{...DEF},active:null});
/* ---------- storage ---------- */
function validate(d){try{
 if(!d||d.v!==1||!Array.isArray(d.cats)||!Array.isArray(d.sessions))return'Not an everyday. backup (version 1).';
 const ids=new Set();for(const c of d.cats){if(!c.id||typeof c.name!=='string'||!/^#[0-9a-f]{6}$/i.test(c.color))return'A category is malformed.';ids.add(c.id)}
 const sid=new Set();for(const s of d.sessions){if(!s.id||sid.has(s.id))return'Duplicate or missing session id.';sid.add(s.id);
  if(!ids.has(s.catId))return'A session points to a missing category.';if(!Number.isFinite(s.start)||!Number.isFinite(s.end)||s.end<=s.start)return'A session has invalid times.';
  if(!Array.isArray(s.segs)||s.segs.some(g=>!Array.isArray(g)||g.length!==2||!(g[1]>g[0])))return'A session has invalid work intervals.'}
 if(d.active&&(!ids.has(d.active.catId)||!MODES[d.active.mode]))return'The active timer is invalid.';
 const h=d.prefs&&d.prefs.startHour;if(!(Number.isInteger(h)&&h>=0&&h<=11))return'Preferences are invalid.';return null}catch(e){return'Unreadable data.'}}
function load(){let notice='';try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r),e=validate(d);if(e){try{localStorage.setItem(KEY+'.corrupt',r)}catch(_){}notice='Saved data was unreadable ('+e+'). A copy was kept under "'+KEY+'.corrupt"; starting fresh.';return[blank(),notice]}return[d,'']}}catch(e){if(e&&e.name!=='SyntaxError'){mem=true;return[blank(),'Browser storage is unavailable: data will be lost when you close this tab. Export often.']}
 try{localStorage.setItem(KEY+'.corrupt',localStorage.getItem(KEY))}catch(_){}notice='Saved data was corrupted; a copy was kept and a fresh start made.'}return[blank(),notice]}
function save(){if(mem)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=true;toast('Could not save to this browser! Export your data now.')}}
/* ---------- workday utility ---------- */
const H=()=>S.prefs.startHour,pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function dayKey(ts){const d=new Date(ts);if(d.getHours()<H())d.setDate(d.getDate()-1);return keyOf(d)}
const k2d=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(k,n)=>{const d=k2d(k);d.setDate(d.getDate()+n);return keyOf(d)};
const nextBound=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d+1,H()).getTime()};
function split(s,e){const o=[];while(s<e){const k=dayKey(s);let t=Math.min(e,nextBound(k));if(t<=s)t=e;o.push([k,t-s]);s=t}return o}
const monday=k=>addDays(k,-((k2d(k).getDay()+6)%7));
/* ---------- aggregation ---------- */
function liveSegs(now){const a=S.active;if(!a)return[];const o=a.segs.map(g=>[...g]);if(a.phase==='work'&&a.runStart!=null)o.push([a.runStart,now]);return o}
function byDay(now){const m={};const add=(c,g)=>split(g[0],g[1]).forEach(([k,ms])=>{(m[k]=m[k]||{})[c]=(m[k][c]||0)+ms});

const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
const hm=ms=>{const m=Math.round(ms/60000);return m<60?m+'m':Math.floor(m/60)+'h '+pad(m%60)+'m'};
const clock=ms=>{ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms/60)%60,s=ms%60;return(h?h+':'+pad(m):pad(m))+':'+pad(s)};
const lvl=ms=>{const h=ms/36e5;return h<=0?0:h<1?1:h<2?2:h<4?3:h<6?4:5};
const cat=id=>S.cats.find(c=>c.id===id)||{name:'(deleted)',color:'#999'};
/* ---------- timer ---------- */
const plen=a=>MODES[a.mode][a.phase==='work'?1:2]*60000;
const pel=(a,n)=>a.phaseElapsed+(a.runStart!=null?n-a.runStart:0);
function advance(n){const a=S.active;if(!a||a.mode==='cont')return false;let ch=false;

  if(a.phase==='work')a.segs.push([a.runStart,t]);a.phase=a.phase==='work'?'break':'work';a.runStart=t;a.phaseElapsed=0;a.tc=(a.tc||0)+1;advance.last={t};ch=true}

const workMs=(n)=>liveSegs(n).reduce((t,g)=>t+g[1]-g[0],0);
function start(catId,mode){if(S.active)return toast('A session is already running.');if(!cat(catId).id&&!S.cats.some(c=>c.id===catId))return;

function pause(){const a=S.active,n=Date.now();advance(n);if(a.runStart!=null){if(a.phase==='work')a.segs.push([a.runStart,n]);a.phaseElapsed+=n-a.runStart;a.runStart=null;a.pauses++}else a.runStart=n;save();play(a.runStart!=null?'resume':'pause');render()}
function finish(){const a=S.active;if(!a)return;const n=Date.now();advance(n);if(a.runStart!=null&&a.phase==='work')a.segs.push([a.runStart,n]);
 const w=a.segs.reduce((t,g)=>t+g[1]-g[0],0);S.active=null;fin=false;
 if(w<1000)toast('Session too short to record; nothing saved.');
 else if(!S.sessions.some(s=>s.id===a.id)){S.sessions.push({id:a.id,catId:a.catId,start:a.start,end:n,segs:a.segs,workMs:w,mode:a.mode,status:'completed',pauses:a.pauses});render.done='Saved '+hm(w)+' to '+cat(a.catId).name+'. Nicely done.';render.pop=dayKey(n);play('finish');clearTimeout(finish.t);finish.t=setTimeout(()=>{render.done=null;render()},7000)}

/* ---------- UI helpers ---------- */

function nextColor(){return COLS.find(c=>!S.cats.some(x=>x.color.toLowerCase()===c.toLowerCase()))||COLS[S.cats.length%COLS.length]}

 const n=f.n.value.trim();if(!n)return'Give it a name.';if(S.cats.some(x=>x.id!==(c&&c.id)&&x.name.toLowerCase()===n.toLowerCase()))return'You already have that category.';
 if(c){c.name=n;c.color=f.c.value}else{const x={id:uid(),name:n,color:f.c.value,archived:false};S.cats.push(x);sel0=x.id}save();render()})}
let sel0=null;
const loc=ts=>{const d=new Date(ts);return keyOf(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
function sessForm(s){const act=S.cats.filter(c=>!c.archived||(s&&c.id===s.catId));if(!act.length)return toast('Create a category first.');
 const base=s||{catId:act[0].id,start:new Date(k2d(sel).setHours(H()+1,0,0,0)).getTime(),end:new Date(k2d(sel).setHours(H()+2,0,0,0)).getTime()};
 modal(s?'Edit session':'Add a missed session','<label>Category</label><select name="c">'+act.map(c=>'<option value="'+c.id+'"'+(c.id===base.catId?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><label>Start</label><input name="s" type="datetime-local" required value="'+loc(base.start)+'"><label>End</label><input name="e" type="datetime-local" required value="'+loc(base.end)+'"><p class="lab">Saving treats the whole range as worked time (pauses are not kept).</p>','Save',f=>{
  const a=new Date(f.s.value).getTime(),b=new Date(f.e.value).getTime();if(!(b>a))return'End must be after start.';if(b>Date.now())return'End is in the future.';
  const id=s&&s.id;if(S.sessions.some(o=>o.id!==id&&a<o.end&&b>o.start)||(S.active&&b>S.active.start))return'That overlaps another session.';
  if(s){Object.assign(s,{catId:f.c.value,start:a,end:b,segs:[[a,b]],workMs:b-a,pauses:0,status:'edited'})}else S.sessions.push({id:uid(),catId:f.c.value,start:a,end:b,segs:[[a,b]],workMs:b-a,mode:'cont',status:'manual',pauses:0});save();render()})}
/* ---------- export / import ---------- */
function exportData(){const j=JSON.stringify({...S,active:S.active,exportedAt:new Date().toISOString()},null,1);
 modal('Export','<p>Copy this JSON or download it, and keep it somewhere safe.</p><textarea readonly id="ex">'+esc(j)+'</textarea>','Download',()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='everyday-'+keyOf(new Date())+'.json';a.click()}catch(e){}toast('If no download started, copy the text instead.');return'Copy the text above if the download did not start.'});
 setTimeout(()=>{const t=$('ex');if(t)t.select()},50)}
function importData(){modal('Import backup','<p class="lab">This <b>replaces all current data</b>. It is validated first.</p><input type="file" accept=".json,application/json" id="fi"><label>or paste JSON</label><textarea name="t"></textarea>','Validate &amp; import',f=>{
 const run=txt=>{let d;try{d=JSON.parse(txt)}catch(e){return'That is not valid JSON.'}delete d.exportedAt;const e=validate(d);if(e)return e;
  sure('Replace everything?','Import '+d.cats.length+' categories and '+d.sessions.length+' sessions? Your current data will be overwritten'+(S.active?' and the running timer discarded':'')+'.','Replace',()=>{S=d;S.active=S.active||null;fixPrefs();sel=dayKey(Date.now());save();render();toast('Backup restored.')});return null};
 const fl=$('fi').files[0];if(fl){const r=new FileReader();r.onload=()=>{const e=run(r.result);if(e)toast(e)};r.readAsText(fl);return null}
 if(!f.t.value.trim())return'Choose a file or paste JSON.';return run(f.t.value)||null})}
/* ---------- render ---------- */
function streak(m,today){let k=sum(m[today])>0?today:addDays(today,-1),n=0;while(sum(m[k])>0){n++;k=addDays(k,-1)}return n}
function render(){const now=Date.now(),m=byDay(now),today=dayKey(now);sel=sel||today;const a=S.active,act=S.cats.filter(c=>!c.archived);
 let mode=render.mode||S.prefs.mode||'cont';if(a)mode=a.mode;lastPh=a&&a.phase;
 const wk=monday(today),mp=today.slice(0,7);let wt=0,mt=0;for(const k in m){const t=sum(m[k]);if(k>=wk&&k<=today)wt+=t;if(k.startsWith(mp))mt+=t}
 const selCat=a?a.catId:(render.cat&&act.some(c=>c.id===render.cat)?render.cat:(sel0&&act.some(c=>c.id===sel0)?sel0:(act[0]||{}).id));render.cat=selCat;
 let timer;
 if(!act.length&&!a)timer='<div class="empty"><p class="d" style="font-size:28px;color:var(--or);margin:0 0 6px">What are you working on?</p>Create your first category (Physics, Editing, Reading — anything) and start the clock.<div class="row" style="justify-content:center"><button class="b pr" data-a="newcat">Create a category</button></div></div>';
 else timer='<svg class="hog hh" viewBox="0 0 120 110" aria-hidden="true"><use href="#hog"/></svg>'+(render.done?'<div class="done" role="status"><b class="d" style="font-size:24px;color:var(--or)">Session saved</b><br>'+esc(render.done)+'</div>':'')+'<h2 class="hl">'+(a?(a.phase==='break'?'Breathe. Stretch. You earned this.':'Deep in it. Keep going.'):'What deserves your time today?')+'</h2>'+(a?'<span class="badge'+(a.phase==='break'?' brk':'')+'" id="bdg"></span>':'')+'<div class="chips">'+(a?'<span class="chip on"><i style="background:'+cat(a.catId).color+'"></i>'+esc(cat(a.catId).name)+'</span>':act.map(c=>'<button class="chip'+(c.id===selCat?' on':'')+'" data-a="pick" data-id="'+c.id+'"><i style="background:'+c.color+'"></i>'+esc(c.name)+'</button>').join('')+'<button class="chip" data-a="newcat">+ New</button>')+'</div>'
  +'<div class="seg">'+Object.entries(MODES).map(([k,v])=>'<button class="chip'+(k===mode?' on':'')+'" '+(a?'disabled style="cursor:default"':'data-a="mode" data-id="'+k+'"')+'>'+v[0]+'</button>').join('')+'</div>'
  +'<div class="ringwrap"><svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="rb" cx="100" cy="100" r="92" pathLength="100"/><circle class="rt" cx="100" cy="100" r="76" pathLength="60"/><circle class="rf" id="rg" cx="100" cy="100" r="92" pathLength="100"/></svg><div class="clock'+(a&&a.runStart!=null?' pulse':'')+(a&&a.phase==='break'?' brk':'')+'" id="clk">0:00</div></div><div class="lab" id="sub">&nbsp;</div>'
  +'<div class="row">'+(a?'<button class="b pr" data-a="pause" title="Space">'+ic(a.runStart!=null?'pause':'play')+(a.runStart!=null?'Pause':'Resume')+'</button><button class="b'+(fin?' dn':'')+'" data-a="finish" title="F, twice">'+ic('check')+(fin?'Tap again to finish &amp; save':'Finish')+'</button>':'<button class="b pr" data-a="start" title="Space" style="font-size:20px;padding:12px 34px">'+ic('play')+'Start</button>')+'</div>';
 const lbl=a?'':'';
 const stats='<div class="stats"><div class="st"><div class="d" id="tt">'+hm(sum(m[today]))+'</div><span class="lab">today</span></div><div class="st"><div class="d">'+hm(wt)+'</div><span class="lab">this week</span></div><div class="st"><div class="d">'+hm(mt)+'</div><span class="lab">this month</span></div><div class="st"><div class="d">'+streak(m,today)+'</div><span class="lab">day streak</span></div></div>';
 $('app').innerHTML='<div class="p top"><h1 class="brand">everyday.</h1><div class="row" style="margin:0"><button class="b sm" data-a="cats" title="Jump to categories">'+ic('tag')+'Categories</button><button class="b sm" data-a="export" title="Back up your data">'+ic('down')+'Export</button><button class="b sm" data-a="import" title="Restore a backup">'+ic('up')+'Import</button><button class="b sm" data-a="settings" title="Sound, notifications, timers (S)">'+ic('gear')+'Settings</button><button class="b sm" data-a="help" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">'+ic('key')+'</button></div></div>'
  +(render.notice?'<div class="p" style="background:#FBD9C9">'+esc(render.notice)+'</div>':'')
  +'<div class="p hero">'+timer+'<p class="lab" style="margin:12px 0 0">Workday: '+k2d(today).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+' · days run '+pad(H())+':00 → '+pad(H())+':00</p></div>'+stats+heat(m,today)+dayPanel(m,today)+catPanel(m)
  +'<p class="lab" style="text-align:center;color:#39362B;margin:4px">Everything is stored only in this browser. Export regularly.</p>';
 tick(true);{const c=document.querySelector('.c.s'),tp=$('tip');if(tp)tp.textContent=c?c.title:'Tap a square to see that day.'}render.pop=null}
function heat(m,today){const W=innerWidth<520?12:innerWidth<1000?18:26,st=addDays(monday(today),-7*(W-1)-7*W*off);let mo='',g='',last='';
 for(let i=0;i<W;i++){const f=addDays(st,i*7),mm=k2d(f).toLocaleDateString(undefined,{month:'short'});mo+='<span style="white-space:nowrap">'+(mm!==last?mm:'')+'</span>';last=mm;
  for(let r=0;r<7;r++){const k=addDays(st,i*7+r),t=sum(m[k]);
   g+='<button class="c'+(k>today?' f':' l'+lvl(t))+(k===today?' t':'')+(k===sel?' s':'')+(k===render.pop?' pop':'')+'" '+(k>today?'disabled':'data-a="day" data-id="'+k+'"')+' title="'+k2d(k).toLocaleDateString(undefined,{month:'short',day:'numeric'})+(k>today?' · upcoming':' · '+hm(t))+'"></button>'}}
 const any=S.sessions.length||S.active;
 return'<div class="p meadow"><svg class="hog hp" viewBox="0 0 120 110" aria-hidden="true"><use href="#hog"/></svg><div class="top"><h2 style="margin:0">Every day</h2><div class="row" style="margin:0"><button class="b sm" data-a="earlier">‹ Earlier</button><button class="b sm" data-a="later"'+(off?'':' disabled')+'>Later ›</button></div></div>'
 +(any?'':'<div class="empty" style="margin-top:12px">Nothing tracked yet. Your first session will light up the first square.</div>')
 +'<div class="hm" id="hm" style="margin-top:6px"><div class="rl"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div><div><div class="mo">'+mo+'</div><div class="g">'+g+'</div></div></div>'
 +'<div class="lab" id="tip" aria-live="polite" style="min-height:1.4em;margin-top:6px"></div><div class="leg">less '+[0,1,2,3,4,5].map(l=>'<span class="c l'+l+'"></span>').join('')+' more · <span class="c f"></span> upcoming · outlined = today · 1h / 2h / 4h / 6h steps</div></div>'}
function dayPanel(m,today){const t=m[sel]||{},tot=sum(t),n=Date.now();
 const rows=S.sessions.map(s=>({s,ms:s.segs.reduce((q,g)=>q+split(g[0],g[1]).filter(p=>p[0]===sel).reduce((x,p)=>x+p[1],0),0)})).filter(r=>r.ms>0).sort((a,b)=>a.s.start-b.s.start);
 const tm=x=>new Date(x).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 const note=sel===today&&new Date(n).getHours()<H()?'It’s before '+pad(H())+':00, so this still counts as yesterday’s workday.':'';
 return'<div class="p page"><div class="top"><h2 style="margin:0">'+k2d(sel).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</h2><div class="row" style="margin:0"><button class="b sm" data-a="dprev">‹</button><button class="b sm" data-a="dtoday">Today</button><button class="b sm" data-a="dnext"'+(sel>=today?' disabled':'')+'>›</button></div></div>'
 +'<p class="lab">Workday '+pad(H())+':00 → '+pad(H())+':00 next day. '+note+'</p><div class="d" style="font-size:44px;color:var(--or)">'+hm(tot)+'</div>'
 +(tot?Object.entries(t).sort((a,b)=>b[1]-a[1]).map(([c,ms])=>'<div style="margin:8px 0"><div class="top"><span><span class="dot" style="background:'+cat(c).color+'"></span>'+esc(cat(c).name)+'</span><span>'+hm(ms)+'</span></div><div class="bar"><b style="width:'+ms/tot*100+'%;background:'+cat(c).color+'"></b></div></div>').join(''):'<div class="empty">No work recorded on this day.</div>')
 +(rows.length?'<h3 class="lab" style="margin:16px 0 0">Sessions</h3>'+rows.map(({s,ms})=>'<div class="li"><span><span class="dot" style="background:'+cat(s.catId).color+'"></span><b>'+esc(cat(s.catId).name)+'</b> · '+tm(s.start)+'–'+tm(s.end)+' · '+hm(ms)+(ms<s.workMs?' (of '+hm(s.workMs)+')':'')+'<br><span class="lab">'+MODES[s.mode][0]+' · '+s.status+(s.pauses?' · '+s.pauses+' pause'+(s.pauses>1?'s':''):'')+'</span></span><span class="row" style="margin:0"><button class="b sm" data-a="edit" data-id="'+s.id+'">Edit</button><button class="b sm dn" data-a="del" data-id="'+s.id+'">Delete</button></span></div>').join(''):'')
 +'<div class="row"><button class="b sm" data-a="add">+ Add a missed session</button></div></div>'}
function catPanel(m){const tot={};S.sessions.forEach(s=>tot[s.catId]=(tot[s.catId]||0)+s.workMs);if(S.active)tot[S.active.catId]=(tot[S.active.catId]||0)+workMs(Date.now());
 const cs=[...S.cats].sort((a,b)=>(a.archived-b.archived)||(tot[b.id]||0)-(tot[a.id]||0));
 return'<div class="p page" id="cats"><div class="top"><h2 style="margin:0">Categories</h2><button class="b sm" data-a="newcat">+ New</button></div>'+(cs.length?cs.map(c=>'<div class="li" style="'+(c.archived?'opacity:.6':'')+'"><span><span class="dot" style="background:'+c.color+'"></span><b>'+esc(c.name)+'</b>'+(c.archived?' (archived)':'')+' · '+hm(tot[c.id]||0)+' total</span><span class="row" style="margin:0"><button class="b sm" data-a="cedit" data-id="'+c.id+'">Edit</button><button class="b sm" data-a="carch" data-id="'+c.id+'">'+(c.archived?'Restore':'Archive')+'</button><button class="b sm dn" data-a="cdel" data-id="'+c.id+'">Delete</button></span></div>').join(''):'<div class="empty">No categories yet.</div>')+'</div>'}
function tick(force){const a=S.active,n=Date.now();if(a&&advance(n)){phaseAlert(n);render();return}
 const c=$('clk');if(!a){document.title='everyday.';return}
 const ph=a.phase==='work'?'Focus':'Break';let txt;if(a.mode==='cont')txt=clock(workMs(n));else txt=clock(plen(a)-pel(a,n)+999);
 if(c)c.textContent=txt;const rg=$('rg');if(rg){const fr=a.mode==='cont'?(workMs(n)%3600000)/3600000:pel(a,n)/plen(a);rg.style.strokeDashoffset=100-Math.min(1,fr)*100;rg.style.stroke=a.phase==='break'?'#5F6B06':''}const bd=$('bdg');if(bd)bd.textContent=(a.runStart==null?'Paused · ':'')+(a.phase==='break'?'Break':a.mode==='cont'?'Tracking':'Focus');const sb=$('sub');if(sb)sb.textContent=(a.runStart==null?'Paused · ':'')+(a.mode==='cont'?'Working':ph+(a.phase==='break'?' (not counted)':''))+' · '+hm(workMs(n))+' worked this session';
 document.title=(a.runStart==null?'⏸ ':'')+txt+' · '+cat(a.catId).name;const t=$('tt');if(t)t.textContent=hm(sum(byDay(n)[dayKey(n)]))}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,today=dayKey(Date.now());
 if(a!=='finish'&&fin){fin=false}
 if(a==='settings')return settingsDlg();if(a==='help')return help();if(a==='pick'||a==='mode'||a==='day')play('click');
 switch(a){
 case'pick':render.cat=id;render();break;case'mode':render.mode=id;render();break;case'start':start(render.cat,render.mode||S.prefs.mode||'cont');break;case'pause':pause();break;
 case'finish':if(!fin){fin=true;render();setTimeout(()=>{if(fin){fin=false;render()}},3500)}else finish();break;
 case'newcat':catForm();break;case'cats':$('cats').scrollIntoView({behavior:'smooth'});break;
 case'day':sel=id;render();break;case'dprev':sel=addDays(sel,-1);render();break;case'dnext':sel=addDays(sel,1);render();break;case'dtoday':sel=today;off=0;render();break;
 case'earlier':off++;render();break;case'later':off=Math.max(0,off-1);render();break;
 case'edit':sessForm(S.sessions.find(s=>s.id===id));break;case'add':sessForm();break;
 case'del':sure('Delete session?','This permanently removes the session and its hours from every total.','Delete',()=>{S.sessions=S.sessions.filter(s=>s.id!==id);save();render()});break;
 case'cedit':catForm(S.cats.find(c=>c.id===id));break;
 case'carch':{const c=S.cats.find(c=>c.id===id);if(S.active&&S.active.catId===id&&!c.archived)return toast('Finish the running session first.');c.archived=!c.archived;save();render()}break;
 case'cdel':{const n=S.sessions.filter(s=>s.catId===id).length;if(S.active&&S.active.catId===id)return toast('Finish the running session first.');
  if(n)modal('Can’t delete yet','<p>This category has '+n+' recorded session'+(n>1?'s':'')+'. Deleting would erase those hours. Archive it instead (hides it from the timer, keeps history), or choose to delete everything.</p>','Archive instead',()=>{S.cats.find(c=>c.id===id).archived=true;save();render()}),
   $('box').querySelector('.row').insertAdjacentHTML('beforeend','<button class="b dn" type="button" onclick="delCat(\''+id+'\')">Delete with history</button>');
  else sure('Delete category?','No sessions use it, so nothing is lost.','Delete',()=>{S.cats=S.cats.filter(c=>c.id!==id);save();render()})}break;
 case'export':exportData();break;case'import':importData();break;
 case'settings':modal('Settings','<label>Workday starts at</label><select name="h">'+[0,1,2,3,4,5,6,7,8].map(h=>'<option value="'+h+'"'+(h===H()?' selected':'')+'>'+pad(h)+':00</option>').join('')+'</select><p class="lab">Changing this re-assigns existing sessions to workdays; no hours are lost. Danger zone: <button class="b sm dn" type="button" onclick="wipe()">Erase all data</button></p>','Save',f=>{if(S.active)return'Finish the running session first.';S.prefs.startHour=+f.h.value;save();render()});break}});
function delCat(id){sure('Delete everything?','This permanently deletes the category AND all its sessions.','Delete all',()=>{S.sessions=S.sessions.filter(s=>s.catId!==id);S.cats=S.cats.filter(c=>c.id!==id);save();render()})}
function wipe(){sure('Erase all data?','This deletes every category and session in this browser. Export a backup first if unsure.','Erase everything',()=>{S=blank();save();render()})}
addEventListener('storage',e=>{if(e.key===KEY){const[d]=load();S=d;fixPrefs();render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')return closeM();if(!$('ov').hidden||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,select,textarea,button,a'))return;
 const q=s=>{const b=document.querySelector(s);if(b&&!b.disabled)b.click()},k=e.key.toLowerCase();
 if(k===' '){e.preventDefault();q('[data-a=start],[data-a=pause]')}else if(k==='f')q('[data-a=finish]');else if(k==='n')catForm();else if(k==='s')settingsDlg();else if(k==='?')help();else if(k==='t')q('[data-a=dtoday]');else if(e.key==='ArrowLeft')q('[data-a=dprev]');else if(e.key==='ArrowRight')q('[data-a=dnext]')});
addEventListener('focus',()=>tick());
$('app').addEventListener('mouseover',e=>{const c=e.target.closest('.c');const tp=$('tip');if(c&&tp&&c.title)tp.textContent=c.title});
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeM()});
{const[d,n]=load();S=d;fixPrefs();render.notice=n;render();$('app').classList.add('intro');setTimeout(()=>$('app').classList.remove('intro'),1500);setInterval(tick,500);
 setTimeout(()=>{const h=$('hm');if(h)h.scrollLeft=h.scrollWidth},0)}
</script></body></html>
